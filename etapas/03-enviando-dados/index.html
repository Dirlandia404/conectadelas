<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapa 3 — ConectaDelas</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 20px; background: #fbf8fc; color: #281f2e; font: 16px/1.55 Arial, sans-serif; }
      main { width: min(980px, 100%); margin: auto; }
      small { color: #66308d; font-weight: bold; text-transform: uppercase; }
      h1, h2 { color: #251337; }
      h1 { margin: 8px 0 32px; font-size: clamp(2.2rem, 6vw, 4rem); }
      .layout { display: grid; grid-template-columns: .85fr 1.15fr; gap: 30px; align-items: start; }
      form, article { border: 1px solid #e8e0eb; border-radius: 18px; background: white; padding: 22px; }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 5px; font-weight: bold; }
      input, select, textarea, button { width: 100%; border: 1px solid #d9cedd; border-radius: 10px; padding: 11px; font: inherit; }
      button { border: 0; background: #66308d; color: white; font-weight: bold; cursor: pointer; }
      button:disabled { opacity: .65; }
      #lista { display: grid; gap: 12px; }
      article h3 { margin: 0 0 2px; }
      article p { margin: 0; color: #6d6273; }
      .sucesso { color: #176548; }
      .erro { color: #a72c49; }
      @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <small>Etapa 3 · Requisições GET e POST</small>
      <h1>Cadastrar oportunidade</h1>

      <div class="layout">
        <form id="formulario">
          <label>Título <input name="titulo" required></label>
          <label>Instituição <input name="instituicao" required></label>
          <label>Modalidade
            <select name="modalidade" required>
              <option value="">Selecione</option>
              <option>Online</option>
              <option>Presencial</option>
              <option>Híbrida</option>
            </select>
          </label>
          <label>Descrição <textarea name="descricao" minlength="10" required></textarea></label>
          <label>Link <input name="link" type="url" required></label>
          <button id="enviar" type="submit">Cadastrar</button>
          <p id="mensagem" role="status"></p>
        </form>

        <section>
          <h2>Dados salvos pela API</h2>
          <div id="lista"></div>
        </section>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
